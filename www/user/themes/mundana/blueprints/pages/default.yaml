title: Generic Page
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          fields:
            header.title:
              replace@: true
            content:
              replace@: true
            header.media_order:
              replace@: true
            _Headings_Section:
              type: section
              underline: true
              title: MUNDANA.ADMIN.DEFAULT.HEADINGS_SECTION
            _Headings:
              type: columns
              fields:
                _Title:
                  type: column
                  fields:
                    header.title:
                      type: text
                      autofocus: true
                      style: vertical
                      label: PLUGIN_ADMIN.TITLE
                    header.show_title:
                      type: toggle
                      style: vertical
                      label: MUNDANA.ADMIN.DEFAULT.SHOW_TITLE
                      help: MUNDANA.ADMIN.DEFAULT.SHOW_TITLE_HELP
                      default: 1
                      highlight: 1
                      options:
                        1: PLUGIN_ADMIN.YES
                        0: PLUGIN_ADMIN.NO
                _Subtitle:
                  type: column
                  fields:
                    header.subtitle:
                      type: text
                      style: vertical
                      label: MUNDANA.ADMIN.DEFAULT.SUBTITLE
                    header.subtitleLead:
                      type: toggle
                      style: vertical
                      markdown: true
                      label: MUNDANA.ADMIN.DEFAULT.SUBTITLE_LEAD
                      description: MUNDANA.ADMIN.DEFAULT.SUBTITLE_LEAD_HELP
                      default: 1
                      highlight: 1
                      options:
                        1: PLUGIN_ADMIN.YES
                        0: PLUGIN_ADMIN.NO
            _publishing_grid:
              type: columns
              classes: custom-grid
              fields:
                # Agrupamos el editor en la columna izquierda
                editor_column:
                  type: column
                  classes: editor-col
                  fields:
                    _Content_Section:
                      type: section
                      underline: true
                      title: MUNDANA.ADMIN.DEFAULT.CONTENT
                    _ContentOptions:
                      type: column
                      fields:
                        content:
                          type: markdown
                          validate:
                            type: textarea

                # Agrupamos el preview en la columna derecha
                preview_column:
                  type: column
                  classes: preview-col
                  fields:
                    _draft_preview_box:
                      type: display
                      style: vertical
                      title: Preview
                      markdown: false
                      evaluate: true
                      content: |
                        {% set preview_url = base_url_relative_all ~ '/preview?slug=' ~ context.route %}
                        <div style="margin-bottom: 20px; border: 2px solid #2dce89; border-radius: 4px; overflow: hidden; background: #eee;">
                          <iframe id="live-preview" 
                                  src="{{ preview_url }}" 
                                  style="width: 100%; min-height: 550px; border: none; background: #fff;">
                          </iframe>
                          <div style="padding: 8px; background: #2dce89; color: white; display: flex; justify-content: space-between; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                            <span style="font-size: 0.85rem;">
                              <strong>Draft Mode:</strong> Previewing <code style="background: rgba(0,0,0,0.1); padding: 2px 4px;">{{ context.route }}</code>
                            </span>
                            <button type="button" onclick="document.getElementById('live-preview').src = '{{ preview_url }}' + '&t=' + new Date().getTime()" 
                                    style="background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #fff; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 0.75rem; font-weight: bold;">
                              Save Changes to Refresh the page!
                            </button>
                          </div>
                        </div>
            _Media_Section:
              type: section
              underline: true
              title: MUNDANA.ADMIN.DEFAULT.IMAGE_OPTIONS      
            _MediaOptions:
              type: columns
              fields:
                _MediaContent:
                  type: column
                  fields:
                    header.media_order:
                      type: pagemedia
                      label: PLUGIN_ADMIN.PAGE_MEDIA
                _ImageOptions:
                  type: column
                  fields:
                    header.show_image:
                      type: toggle
  
                      label: MUNDANA.ADMIN.DEFAULT.SHOW_FEATURED_IMAGE
                      help: MUNDANA.ADMIN.DEFAULT.SHOW_FEATURED_IMAGE_HELP
                      default: 1
                      highlight: 1
                      options:
                        1: PLUGIN_ADMIN.YES
                        0: PLUGIN_ADMIN.NO
                      validate:
                        type: bool
                    header.featuredImage:
                      ordering@: header.subtitle
                      size: large
                      type: pagemediaselect
                      label: MUNDANA.ADMIN.DEFAULT.FEATURED_IMAGE.LABEL
                      help: MUNDANA.ADMIN.DEFAULT.FEATURED_IMAGE.HELP
                      preview_images: true
                    header.image_width:
                      type: number
                      label: MUNDANA.ADMIN.DEFAULT.FEATURED_IMAGE.WIDTH
                      size: small
                      placeholder: 672
                    header.image_height:
                      type: number
                      label: MUNDANA.ADMIN.DEFAULT.FEATURED_IMAGE.HEIGHT
                      size: small
                      placeholder: 504
        advanced:
          fields:
            columns:
              fields:
                column1:
                   fields:
                    header.body_classes:
                      markdown: true
                      label: MUNDANA.ADMIN.DEFAULT.BODY_CLASSES
                      help: MUNDANA.ADMIN.DEFAULT.BODY_CLASSES_HELP
                      description: MUNDANA.ADMIN.DEFAULT.BODY_CLASSES_DESCRIPTION
            overrides:
              fields:
                header.icon_menu:
                  type: text
                  label: MUNDANA.ADMIN.DEFAULT.ICON_MENU
                  description: MUNDANA.ADMIN.DEFAULT.ICON_MENU_DESCRIPTION
                  ordering@: header.menu
                  toggleable: true
                  size: medium
        options:
          fields:
            PageOptions:
              type: section
              title: MUNDANA.ADMIN.DEFAULT.SETTINGS
              ordering@: -10
            header.style:
              type: select
              label: MUNDANA.ADMIN.THEME.PAGE_STYLE.LABEL
              help: MUNDANA.ADMIN.THEME.PAGE_STYLE.HELP
              description: MUNDANA.ADMIN.THEME.PAGE_STYLE.DESCRIPTION
              size: medium
              toggleable: true
              data-options@: '\Grav\Theme\Mundana::getPageStyles'
              ordering@: PageOptions