extends@: default

form:
  fields:
    tabs:

      fields:
        content:
          type: tab
          fields:
            _Headings:
              type: columns
              fields:
                _Title:
                  type: column
                  fields:
                    header.show_title:
                      unset@: true
        blog:
          type: tab
          title: MUNDANA.ADMIN.ITEM.TAB

          fields:
            _draft_preview_box:
              type: display
              style: vertical
              title: Preview
              markdown: false
              evaluate: true
              content: |
                {% set preview_url = base_url_relative_all ~ '/preview?slug=' ~ context.route %}
                <div style="margin-bottom: 20px; border: 2px solid #2dce89; border-radius: 4px; overflow: hidden; background: #eee;">
                  <iframe id="live-preview" 
                          src="{{ preview_url }}" 
                          style="width: 100%; height: 550px; border: none; background: #fff;">
                  </iframe>
                  <div style="padding: 8px; background: #2dce89; color: white; display: flex; justify-content: space-between; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                    <span style="font-size: 0.85rem;">
                      <strong>Draft Mode:</strong> Previewing <code style="background: rgba(0,0,0,0.1); padding: 2px 4px;">{{ context.route }}</code>
                    </span>
                    <button type="button" onclick="document.getElementById('live-preview').src = '{{ preview_url }}' + '&t=' + new Date().getTime()" 
                            style="background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #fff; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 0.75rem; font-weight: bold;">
                      REFRESH PAGE
                    </button>
                  </div>
                </div>
            _summaryConfig:
              type: section
              title: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.LABEL
            header.show_summary:
              type: toggle
              toggleable: true
              label: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.SHOW
              help: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.SHOW_HELP
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.summary.enabled:
              type: toggle
              toggleable: true
              label: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.ENABLED
              highlight: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            header.summary.format:
              type: select
              toggleable: true
              label: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.FORMAT.LABEL
              classes: fancy
              options:
                'short': MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.FORMAT.SHORT
                'long': MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.FORMAT.LONG
            header.summary.size:
              type: text
              toggleable: true
              label: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.SIZE
              classes: large
              placeholder: 300
              validate:
                type: int
                min: 1
            header.summary.delimiter:
              type: text
              toggleable: true
              label: MUNDANA.ADMIN.ITEM.CONTENT.SUMMARY.DELIMITER
              classes: large
              placeholder: ===
          import@:
            type: partials/item-bits
